[package]
name = "momonogi"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Local shared memory for multiple AI agents"
repository = "https://github.com/coolcoolcool/azusa"

[[bin]]
name = "momo"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
uuid = { version = "1.18", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.23"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
