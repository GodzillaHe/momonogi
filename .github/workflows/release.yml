name: macOS DMG

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish, for example v0.0.1-alpha.2
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-dmg-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-dmg:
    runs-on: macos-14
    defaults:
      run:
        working-directory: desktop
    env:
      MOMONOGI_TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Resolve release version
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
          else
            tag="$GITHUB_REF_NAME"
          fi
          version=$(node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json', 'utf8')).version")
          if [[ "$tag" != "v$version" ]]; then
            echo "release tag $tag does not match desktop version v$version" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Rust toolchain
        shell: bash
        run: |
          rustup update stable
          rustup default stable
          rustup target add "$MOMONOGI_TARGET"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Frontend tests
        run: pnpm test
      - name: Build ad-hoc signed arm64 DMG
        run: pnpm tauri build --target "$MOMONOGI_TARGET" --bundles dmg --ci
      - name: Verify DMG bundle
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          dmg_dir="src-tauri/target/$MOMONOGI_TARGET/release/bundle/dmg"
          dmg_path="$dmg_dir/Momonogi_${RELEASE_VERSION}_aarch64.dmg"
          if [[ ! -f "$dmg_path" ]]; then
            echo "DMG was not produced at $dmg_path" >&2
            exit 1
          fi

          mount_dir=$(mktemp -d)
          device=""
          cleanup() {
            if [[ -n "$device" ]]; then
              hdiutil detach "$device" >/dev/null || true
            fi
            rmdir "$mount_dir" 2>/dev/null || true
          }
          trap cleanup EXIT

          device=$(hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "$dmg_path" | awk '/^\/dev\// { print $1; exit }')
          app_path="$mount_dir/Momonogi.app"
          codesign --verify --deep --strict --verbose=4 "$app_path"
          file "$app_path/Contents/MacOS/momonogi-desktop" | grep -q 'arm64'
          file "$app_path/Contents/MacOS/momo" | grep -q 'arm64'
          "$app_path/Contents/MacOS/momo" --version
      - name: Prepare release files
        id: package
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          dmg_dir="src-tauri/target/$MOMONOGI_TARGET/release/bundle/dmg"
          dmg_path="$dmg_dir/Momonogi_${RELEASE_VERSION}_aarch64.dmg"
          if [[ ! -f "$dmg_path" ]]; then
            echo "DMG was not produced at $dmg_path" >&2
            exit 1
          fi
          dmg_name=$(basename "$dmg_path")
          (
            cd "$dmg_dir"
            shasum -a 256 "$dmg_name" > "$dmg_name.sha256"
          )
          echo "dmg_path=$dmg_path" >> "$GITHUB_OUTPUT"
          echo "checksum_path=$dmg_path.sha256" >> "$GITHUB_OUTPUT"
          echo "dmg_name=$dmg_name" >> "$GITHUB_OUTPUT"
      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Momonogi-${{ steps.release.outputs.version }}-aarch64-dmg
          path: |
            desktop/${{ steps.package.outputs.dmg_path }}
            desktop/${{ steps.package.outputs.checksum_path }}
          if-no-files-found: error
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          DMG_PATH: ${{ steps.package.outputs.dmg_path }}
          CHECKSUM_PATH: ${{ steps.package.outputs.checksum_path }}
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "Momonogi Desktop $RELEASE_VERSION" \
              --generate-notes
          fi
          gh release upload "$RELEASE_TAG" "$DMG_PATH" "$CHECKSUM_PATH" --clobber
